# NOTE: the "zz" prefix is deliberate. systemd-sysctl sorts every file
# lexicographically regardless of directory, and CachyOS ships
# /etc/sysctl.d/99-cachyos-laptop.conf which re-sets default_qdisc = cake.
# A name sorting after "99-cachyos-*" is required for this to win.
#
# Congestion control: BBR pairs with fq, its own pacing qdisc.
# CAKE is applied only to the wireless interface by the NetworkManager
# dispatcher, instead of being forced onto every device.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
