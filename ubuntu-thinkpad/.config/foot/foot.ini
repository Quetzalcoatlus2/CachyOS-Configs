[main]
shell=/home/ABO4198/.local/bin/zsh
font=monospace:size=8
selection-target=both
# Bold palette colors use their bright variants
bold-text-in-bright=palette-based

[colors-dark]
background=000000
foreground=ffffff
regular0=000000
regular1=00b8d4
regular2=50fa7b
regular3=ffd93d
regular4=5c9dff
regular5=ff5fd2
regular6=00e5ff
regular7=e0e0e0
bright0=7a7a7a
bright1=66f0ff
bright2=8dffa6
bright3=fff19a
bright4=8fbcff
bright5=ff9ee6
bright6=80f0ff
bright7=ffffff
cursor=000000 00e5ff
selection-foreground=000000
selection-background=ffffff
urls=5c9dff
jump-labels=000000 ffd93d
scrollback-indicator=000000 ff5fd2
search-box-no-match=ffffff ff5555
search-box-match=000000 50fa7b

[cursor]
style=block
blink=yes

[key-bindings]
# Clipboard shortcuts without Shift
clipboard-copy=Control+c
clipboard-paste=Control+v

# Single-key jump to top and bottom
scrollback-home=F1
scrollback-end=F2

# Page scrolling
scrollback-up-page=Mod1+Up
scrollback-down-page=Mod1+Down

# Pipe entire buffer to clipboard
pipe-scrollback=[/home/ABO4198/.local/bin/wl-copy] Control+Shift+a

[text-bindings]
# Send SIGINT (ASCII 0x03) via Ctrl+Shift+C
\x03=Control+Shift+c
