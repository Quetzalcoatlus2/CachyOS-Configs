[main]
shell=/home/ABO4198/.local/bin/zsh
font=monospace:size=8
selection-target=both
# Bold palette colors use their bright variants
bold-text-in-bright=palette-based

[colors-dark]
background=000000
foreground=ffffff
regular0=000000
regular1=00acc1
regular2=00a152
regular3=ffab00
regular4=2979ff
regular5=f50057
regular6=00bcd4
regular7=e0e0e0
bright0=757575
bright1=26c6da
bright2=00e676
bright3=ffd600
bright4=448aff
bright5=ff4081
bright6=00e5ff
bright7=ffffff
cursor=000000 26c6da
selection-foreground=000000
selection-background=ffd600
urls=00e5ff
jump-labels=000000 00e676
scrollback-indicator=000000 ff4081
search-box-no-match=000000 ff5252
search-box-match=000000 00c853

[cursor]
style=block
blink=yes

[key-bindings]
# Ctrl+C is reserved for text editing (see [text-bindings]).
# Mouse selections in a shell copy automatically.
clipboard-copy=Control+Insert
# Ctrl+V pastes the clipboard in a shell and in Micro; Ctrl+Shift+V is
# the conventional terminal fallback.
clipboard-paste=Control+v Control+Shift+v

# Single-key jump to top and bottom
scrollback-home=F1
scrollback-end=F2

# Page scrolling
scrollback-up-page=Mod1+Up
scrollback-down-page=Mod1+Down

# Pipe entire buffer to clipboard
pipe-scrollback=[/home/ABO4198/.local/bin/wl-copy] Control+Shift+a

[text-bindings]
# Ctrl+C sends NUL so the shell marks text and Micro copies it instead of
# receiving SIGINT. Ctrl+Shift+C sends SIGINT (ASCII 0x03).
\x00=Control+c
\x03=Control+Shift+c
