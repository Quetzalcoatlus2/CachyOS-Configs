[main]
shell=/usr/bin/zsh
font=monospace:size=11
selection-target=both

# foot 1.11 (Ubuntu 22.04) reads [colors] only, not [colors-dark].
[colors]
background=000000
foreground=ffffff
regular0=000000

[cursor]
style=block
blink=yes
color=000000 ffffff

[key-bindings]
clipboard-copy=Control+c
clipboard-paste=Control+v
scrollback-up-page=Mod1+Up
scrollback-down-page=Mod1+Down
pipe-scrollback=[wl-copy] Control+Shift+a
