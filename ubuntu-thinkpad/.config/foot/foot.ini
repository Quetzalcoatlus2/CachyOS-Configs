[main]
shell=/usr/bin/zsh
font=Fira Code:size=5,monospace:size=5
selection-target=both

# foot 1.11 (Ubuntu 22.04) reads [colors] only, not [colors-dark].
[colors]
background=000000
foreground=ffffff
regular0=000000
regular1=00b8d4
regular5=00b8d4
regular6=00e5ff
bright1=66f0ff
bright5=00e5ff
bright6=80f0ff

[cursor]
style=block
blink=yes
color=000000 ffffff

[key-bindings]
clipboard-copy=Control+c
clipboard-paste=Control+v
scrollback-up-page=Mod1+Up F1
scrollback-down-page=Mod1+Down F2
pipe-scrollback=[wl-copy] Control+Shift+a
