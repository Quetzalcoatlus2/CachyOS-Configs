filetype: unknown

detect:
    filename: '.*'

rules:
    - constant.string:
        start: '"'
        end: '"'
        skip: '\\.'
        rules:
            - constant.specialChar: '\\.'
    - constant.string:
        start: "'"
        end: "'"
        skip: '\\.'
        rules:
            - constant.specialChar: '\\.'
    - constant.number: '\b[0-9]+(\.[0-9]+)?\b'
    - constant: '\b(true|false|yes|no|on|off)\b'
    - identifier: '^\s*[A-Za-z0-9_.-]+(\s*=|:)'
    - special: '^\s*\[[^\]]+\]'
    - symbol: '[=:;]'
    - comment: '(^|\s)#.*$'
