[main]
selection-target=both
# Bold palette colors use their bright variants
bold-text-in-bright=palette-based

[colors-dark]
background=000000
foreground=ffffff
regular0=000000
regular1=ff5252
regular2=00e676
regular3=ffd600
regular4=448aff
regular5=ff4081
regular6=00e5ff
regular7=e0e0e0
bright0=757575
bright1=ff8a80
bright2=69f0ae
bright3=ffff00
bright4=82b1ff
bright5=ff80ab
bright6=84ffff
bright7=ffffff
cursor=000000 00e5ff
selection-foreground=000000
selection-background=ffd600
urls=82b1ff
jump-labels=000000 00e676
scrollback-indicator=000000 ff4081
search-box-no-match=000000 ff5252
search-box-match=000000 69f0ae

[cursor]
style=block
blink=yes

[key-bindings]
# Clipboard shortcuts without Shift
clipboard-copy=Control+c
clipboard-paste=Control+v

# Single-key jump to top and bottom
scrollback-home=F1
scrollback-end=F2

# Page scrolling
scrollback-up-page=Mod1+Up
scrollback-down-page=Mod1+Down

# Pipe entire buffer to clipboard
pipe-scrollback=[wl-copy] Control+Shift+a

[text-bindings]
# Send SIGINT (ASCII 0x03) via Ctrl+Shift+C
\x03=Control+Shift+c
