[main]
selection-target=both

[colors-dark]
background=000000
foreground=ffffff
regular0=000000
regular1=00b8d4
regular5=00b8d4
regular6=00e5ff
bright1=66f0ff
bright5=00e5ff
bright6=80f0ff
cursor=000000 ffffff

[cursor]
style=block
blink=yes

[key-bindings]
clipboard-paste=Control+v

# Single-key jump to top and bottom
scrollback-home=F1
scrollback-end=F2

# Page scrolling
scrollback-up-page=Mod1+Up
scrollback-down-page=Mod1+Down

# Pipe entire buffer to clipboard
pipe-scrollback=[wl-copy] Control+Shift+a

